name: Release

# Push a tag like v1.0.2 (matching `version:` in pubspec.yaml) and this builds
# the Windows installer and portable zip and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/velora_engine/go.mod
          cache-dependency-path: native/velora_engine/go.sum

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build and package
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Velora-Setup-*.exe
            dist/Velora-*-windows-x64.zip
            dist/SHA256SUMS.txt

      - name: Keep the build as a workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: velora-windows
          path: |
            dist/Velora-Setup-*.exe
            dist/Velora-*-windows-x64.zip
            dist/SHA256SUMS.txt
